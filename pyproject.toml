[project]
name = "terra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.162.1",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]
